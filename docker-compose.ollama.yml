version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: dress-ai-ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

  dress-ai:
    environment:
      - ENABLE_OLLAMA=true
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
