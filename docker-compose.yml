version: "3.9"

services:
  dress-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dress-ai-service
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./.env:/app/.env:ro
    environment:
      - DATABASE_URL=sqlite:///data/wardrobe.db
      - MODELS_DIR=/app/models
      - UPLOAD_DIR=/app/data/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

